# Demo-box operations utility. Small SSH-driven maintenance jobs that need
# the deploy key but not a full deploy: today that's diagnosing the market
# catalog sync (the box's outbound HTTP is historically unreliable — builds
# already moved runner-side for the same reason; see deploy-demo.yml).
#
# Dispatch-only. Keep every job read-only unless its name says otherwise.
name: demo-ops

on:
  workflow_dispatch:
    inputs:
      diagnose_sync:
        description: "Probe upstream catalog APIs from the box + dump recent sync logs"
        type: boolean
        default: true
      restart_gateway:
        description: "Restart the gateway container (fires an immediate catalog boot-sync)"
        type: boolean
        default: false
      disk_report:
        description: "Read-only disk usage breakdown (df, docker system df, biggest dirs/files)"
        type: boolean
        default: false
      disk_cleanup:
        description: "WRITE ACTION: truncate container json logs >200M (docker logs history is lost)"
        type: boolean
        default: false

concurrency:
  group: demo-ops
  cancel-in-progress: false

env:
  BOX: 91.98.118.132

jobs:
  diagnose:
    if: ${{ inputs.diagnose_sync }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$BOX" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Recent sync log lines (gateway container)
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@"$BOX" '
            docker logs predict_gateway 2>&1 |
              grep -E "market sync|discover fetch failed|budget exhausted" |
              tail -30
          '

      - name: Probe upstream APIs from the box
        # Same endpoints the fetchers hit. -sS keeps errors visible; the
        # per-URL timeout stops a black-holed route from eating the job.
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@"$BOX" '
            for url in \
              "https://gamma-api.polymarket.com/markets?limit=1" \
              "https://api.elections.kalshi.com/trade-api/v2/markets?limit=1" \
              "https://api.manifold.markets/v0/markets?limit=1"; do
              echo "── $url"
              curl -sS -o /tmp/probe.out -w "http=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s total=%{time_total}s\n" \
                --max-time 20 "$url" || echo "curl failed: $?"
              head -c 200 /tmp/probe.out; echo
            done
          '

      - name: Container egress probe (docker network)
        # The 2026-07-07 incident was container-only egress loss (cf-firewall
        # DOCKER-USER drop) — host probes passed while containers starved.
        # Probe from inside the compose network to catch that class.
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@"$BOX" '
            NET=$(docker inspect predict_gateway --format "{{range \$k,\$v := .NetworkSettings.Networks}}{{\$k}}{{end}}")
            echo "network: $NET"
            docker run --rm --network "$NET" curlimages/curl:8.10.1 \
              -sS -o /dev/null -w "container->polymarket http=%{http_code} total=%{time_total}s\n" \
              --max-time 20 "https://gamma-api.polymarket.com/markets?limit=1" || echo "container egress FAILED: $?"
          '

      - name: DNS + egress sanity from the box
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@"$BOX" '
            echo "── resolv.conf:"; cat /etc/resolv.conf | tail -3
            echo "── ufw status:"; ufw status | head -20 || true
            echo "── generic egress:"; curl -sS -o /dev/null -w "github http=%{http_code} total=%{time_total}s\n" --max-time 15 https://api.github.com/ || echo "curl failed: $?"
          '

  disk-report:
    if: ${{ inputs.disk_report }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$BOX" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Disk usage breakdown (read-only)
        # Added 2026-09-06: the deploy guard tripped at 97% full and
        # docker system prune reclaimed almost nothing, so the space is
        # somewhere prune can't see (volumes, container json logs, /opt
        # trees, big stray files). Report only — cleanup is a separate,
        # deliberate action once the numbers name the culprit.
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@"$BOX" '
            echo "── df:"; df -h /
            echo "── top-level dirs:"; du -xh -d1 / 2>/dev/null | sort -rh | head -12
            echo "── /var/lib/docker:"; du -xh -d1 /var/lib/docker 2>/dev/null | sort -rh | head -10
            echo "── container json logs:"; du -sh /var/lib/docker/containers/*/*-json.log 2>/dev/null | sort -rh | head -10
            echo "── docker system df:"; docker system df
            echo "── volumes:"; docker system df -v 2>/dev/null | sed -n "/VOLUME NAME/,/^$/p" | head -25
            echo "── /opt:"; du -xh -d2 /opt 2>/dev/null | sort -rh | head -12
            echo "── /var/log:"; du -xh -d1 /var/log 2>/dev/null | sort -rh | head -8
            echo "── /tmp + /root:"; du -xh -d1 /tmp /root 2>/dev/null | sort -rh | head -10
            echo "── files over 300M:"; find / -xdev -type f -size +300M -exec ls -lh {} \; 2>/dev/null | awk "{print \$5, \$9}" | sort -rh | head -15
          '

  disk-cleanup:
    if: ${{ inputs.disk_cleanup }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$BOX" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Truncate oversized container json logs (WRITE)
        # 2026-09-06: ~23GB of unrotated json-file logs filled the box to 97%
        # and tripped the deploy disk guard. Truncating a live json-log is
        # safe (docker keeps writing to the same fd); `docker logs` history is
        # lost, acceptable on the demo box. The permanent fix is the logging
        # cap in docker-compose.demo.yml — this job recovers a box whose
        # containers predate that cap.
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@"$BOX" '
            echo "── before:"; df -h /
            for f in $(find /var/lib/docker/containers -name "*-json.log" -size +200M); do
              cid=$(basename "$f" -json.log)
              name=$(docker ps -a --no-trunc --format "{{.ID}} {{.Names}}" | grep "$cid" | awk "{print \$2}")
              echo "truncating ${cid:0:12} (${name:-unknown}) $(du -sh "$f" | cut -f1)"
              truncate -s 0 "$f"
            done
            echo "── after:"; df -h /
          '

  restart-gateway:
    if: ${{ inputs.restart_gateway }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$BOX" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Restart gateway and wait for boot sync
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new root@"$BOX" '
            docker restart predict_gateway
            for i in $(seq 1 40); do
              docker logs --since 3m predict_gateway 2>&1 | grep -qE "market sync (complete|failed)" && break
              sleep 5
            done
            docker logs --since 3m predict_gateway 2>&1 | grep -E "market sync (complete|failed)|discover fetch failed" | tail -5
          '
