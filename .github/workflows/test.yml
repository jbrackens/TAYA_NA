name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cashier-guards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for external symlinks
        run: scripts/check-no-external-symlinks.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: apps/taptrade-platform/frontend/yarn.lock

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install shell dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install frontend workspace dependencies
        working-directory: apps/taptrade-platform/frontend
        run: yarn install --frozen-lockfile

      - name: Run cashier guard checks
        run: scripts/check-cashier-all.sh

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Workspace root — yarn workspaces are declared here and yarn.lock
        # lives here. Installing from a sub-package via npm causes hour-long
        # resolution loops because the workspace root isn't detected.
        working-directory: apps/taptrade-platform/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: apps/taptrade-platform/frontend/yarn.lock

      - name: Install dependencies (workspace root)
        run: yarn install --frozen-lockfile

      - name: Biome lint wall (app-scoped)
        # Lint only — platform-safe on ubuntu. Scoped to packages/app: the
        # office package has its own pending burn-down and would hold this
        # red forever. Visual regression stays darwin-local (snapshots are
        # platform-suffixed) and is deliberately NOT run here.
        run: npx @biomejs/biome check packages/app/app

      - name: Run unit tests
        # Top-level tests only. Integration tests live in __tests__/integration/
        # and need a running gateway; they run in a separate workflow.
        working-directory: apps/taptrade-platform/frontend/packages/app
        run: npm test

  go-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build platform
        working-directory: apps/taptrade-platform/go-platform/modules/platform
        run: go build ./...

      - name: Test platform
        working-directory: apps/taptrade-platform/go-platform/modules/platform
        run: go test -race -count=1 ./...

      - name: Build gateway
        working-directory: apps/taptrade-platform/go-platform/services/gateway
        run: go build ./...

      - name: Test gateway
        working-directory: apps/taptrade-platform/go-platform/services/gateway
        run: go test -race -count=1 ./...

      - name: Build auth
        working-directory: apps/taptrade-platform/go-platform/services/auth
        run: go build ./...

      - name: Test auth
        working-directory: apps/taptrade-platform/go-platform/services/auth
        run: go test -race -count=1 ./...
