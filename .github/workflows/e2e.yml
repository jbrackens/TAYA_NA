name: E2E journey suite (P3-11)

# Improvement-plan P3-11: end-to-end user-journey smoke suite against a real,
# freshly-seeded stack (postgres + auth + gateway + player app). Encodes the
# recipe documented in packages/app/playwright.config.ts ("CI will wire steps
# 1-3 into a GitHub Action in a future commit").
#
# The app runs in `next dev` (not a production build) to fit the time budget —
# a Next build is ~15-20 min. Flake mitigation per the plan: log in once and
# reuse storage state (auth.setup.ts), warm the routes before the timed suite,
# desktop project only, sequential workers. Mobile + production-build can be
# layered on once this is reliably green.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/Phoenix-Predict-Combined/talon-backoffice/**'
      - 'apps/Phoenix-Predict-Combined/go-platform/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: predict
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: predict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predict"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DSN: postgres://predict:localdev@localhost:5432/predict?sslmode=disable
      GW: apps/Phoenix-Predict-Combined/go-platform/services/gateway
      AUTH: apps/Phoenix-Predict-Combined/go-platform/services/auth
      APP: apps/Phoenix-Predict-Combined/talon-backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: apps/Phoenix-Predict-Combined/talon-backoffice/yarn.lock

      - name: Migrate schema + seed base data
        working-directory: ${{ env.GW }}
        env:
          GATEWAY_DB_DSN: ${{ env.DSN }}
        run: |
          export MIGRATIONS_DIR="$(pwd)/migrations"
          go run ./cmd/migrate up
          go run ./cmd/seed

      - name: Start auth service (:18081)
        working-directory: ${{ env.AUTH }}
        env:
          AUTH_STORE_MODE: db
          AUTH_DB_DSN: ${{ env.DSN }}
          AUTH_COOKIE_SECURE: 'false'
          AUTH_FRONTEND_URL: http://localhost:3010
        run: |
          nohup go run ./cmd/auth > /tmp/auth.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://localhost:18081/healthz >/dev/null && break || sleep 2; done
          curl -fsS http://localhost:18081/healthz || { echo "::error::auth failed to start"; tail -50 /tmp/auth.log; exit 1; }

      - name: Start gateway (:18080)
        working-directory: ${{ env.GW }}
        env:
          GATEWAY_DB_DSN: ${{ env.DSN }}
          WALLET_DB_DSN: ${{ env.DSN }}
          WALLET_STORE_MODE: db
          GATEWAY_PORT: '18080'
          GATEWAY_READ_REPO_MODE: db
          PAYMENTS_WEBHOOK_SECRET: whsec_local
          AUTH_SERVICE_URL: http://localhost:18081
          GATEWAY_ALLOW_ADMIN_ANON: 'true'
        run: |
          nohup go run ./cmd/gateway > /tmp/gateway.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://localhost:18080/healthz >/dev/null && break || sleep 2; done
          curl -fsS http://localhost:18080/healthz || { echo "::error::gateway failed to start"; tail -50 /tmp/gateway.log; exit 1; }
          # Prove the stack is seeded + reachable through the gateway.
          curl -fsS http://localhost:18080/api/v1/markets >/dev/null || { echo "::error::gateway /markets not serving"; tail -50 /tmp/gateway.log; exit 1; }

      - name: Install frontend deps + build api-client
        working-directory: ${{ env.APP }}
        run: |
          yarn install --frozen-lockfile
          yarn lerna run build --scope @phoenix-ui/api-client --include-dependencies

      - name: Start player app (next dev :3010)
        working-directory: ${{ env.APP }}/packages/app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:18080
          NEXT_PUBLIC_AUTH_URL: http://localhost:18081
          NEXT_PUBLIC_WS_URL: ws://localhost:18080/ws
        run: |
          nohup npx next dev --webpack -p 3010 > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3010/ >/dev/null && break || sleep 2; done
          curl -fsS http://localhost:3010/ >/dev/null || { echo "::error::player app failed to start"; tail -80 /tmp/app.log; exit 1; }

      - name: Warm routes (dev-mode compiles on first hit)
        run: |
          for p in / /auth/login /predict /portfolio /leaderboards /account /rewards; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "http://localhost:3010$p" || echo 000)
            echo "warm $p -> $code"
          done

      - name: Install Playwright Chromium
        working-directory: ${{ env.APP }}/packages/app
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite (desktop)
        working-directory: ${{ env.APP }}/packages/app
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://localhost:3010
        run: npx playwright test --config=./playwright.config.ts --project=setup --project=desktop-chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/Phoenix-Predict-Combined/talon-backoffice/packages/app/playwright-report
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::auth.log"; tail -120 /tmp/auth.log 2>/dev/null; echo "::endgroup::"
          echo "::group::gateway.log"; tail -120 /tmp/gateway.log 2>/dev/null; echo "::endgroup::"
          echo "::group::app.log"; tail -200 /tmp/app.log 2>/dev/null; echo "::endgroup::"
