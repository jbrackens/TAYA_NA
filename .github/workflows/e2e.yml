name: E2E journey suite (P3-11)

# Improvement-plan P3-11: end-to-end user-journey smoke suite against a real,
# freshly-seeded stack (postgres + auth + gateway + player app). Encodes the
# recipe documented in packages/app/playwright.config.ts ("CI will wire steps
# 1-3 into a GitHub Action in a future commit").
#
# The app runs in `next dev` (not a production build) to fit the time budget —
# a Next build is ~15-20 min. Flake mitigation per the plan: log in once and
# reuse storage state (auth.setup.ts), warm the routes before the timed suite,
# desktop project only, sequential workers. Mobile + production-build can be
# layered on once this is reliably green.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/taptrade-platform/frontend/**'
      - 'apps/taptrade-platform/go-platform/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: predict
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: predict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predict"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DSN: postgres://predict:localdev@localhost:5432/predict?sslmode=disable
      GW: apps/taptrade-platform/go-platform/services/gateway
      AUTH: apps/taptrade-platform/go-platform/services/auth
      APP: apps/taptrade-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: apps/taptrade-platform/frontend/yarn.lock

      - name: Migrate schema
        working-directory: ${{ env.GW }}
        env:
          GATEWAY_DB_DSN: ${{ env.DSN }}
        run: |
          export MIGRATIONS_DIR="$(pwd)/migrations"
          go run ./cmd/migrate up

      - name: Start auth service (:18081)
        working-directory: ${{ env.AUTH }}
        env:
          AUTH_STORE_MODE: db
          AUTH_DB_DSN: ${{ env.DSN }}
          AUTH_COOKIE_SECURE: 'false'
          AUTH_FRONTEND_URL: http://localhost:3010
        run: |
          nohup go run ./cmd/auth > /tmp/auth.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://localhost:18081/healthz >/dev/null && break || sleep 2; done
          curl -fsS http://localhost:18081/healthz || { echo "::error::auth failed to start"; tail -50 /tmp/auth.log; exit 1; }

      - name: Start gateway (:18080)
        working-directory: ${{ env.GW }}
        env:
          GATEWAY_DB_DSN: ${{ env.DSN }}
          WALLET_DB_DSN: ${{ env.DSN }}
          WALLET_STORE_MODE: db
          GATEWAY_PORT: '18080'
          GATEWAY_READ_REPO_MODE: db
          PAYMENTS_WEBHOOK_SECRET: whsec_local
          # The journey suite exercises the existing demo point-store flow.
          # Keep its opt-in boundary explicit so a fresh E2E stack exposes
          # the catalogue routes that the Store journeys cover.
          STORE_ENABLED: 'true'
          STORE_PROVIDER: demo
          STORE_WEBHOOK_SECRET: whsec_local
          AUTH_SERVICE_URL: http://localhost:18081
          GATEWAY_ALLOW_ADMIN_ANON: 'true'
          # E2E hammers public reads from one IP (journeys + smokes +
          # per-market history fetches); the 120rpm default 429s mid-suite.
          GATEWAY_RATELIMIT_RPM: '2400'
        run: |
          nohup go run ./cmd/gateway > /tmp/gateway.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://localhost:18080/healthz >/dev/null && break || sleep 2; done
          curl -fsS http://localhost:18080/healthz || { echo "::error::gateway failed to start"; tail -50 /tmp/gateway.log; exit 1; }
          # Gateway reachable (markets endpoint serves; empty pre-seed is fine).
          curl -fsS http://localhost:18080/api/v1/markets >/dev/null || { echo "::error::gateway /markets not serving"; tail -50 /tmp/gateway.log; exit 1; }
          # The protected store catalogue must be mounted for the journey
          # suite. A 403 proves the route exists without requiring a session.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/api/v1/store/packs)" = "403" || { echo "::error::gateway store catalogue not mounted"; tail -50 /tmp/gateway.log; exit 1; }

      - name: Seed demo data
        working-directory: ${{ env.GW }}
        env:
          GATEWAY_DB_DSN: ${{ env.DSN }}
          WALLET_DB_DSN: ${{ env.DSN }}
          WALLET_STORE_MODE: db
        run: |
          # AFTER gateway boot on purpose: the wallet tables
          # (wallet_balances/ledger/reservations) are created by the wallet
          # service's ensureSchema at gateway startup, NOT by goose migrations,
          # and the demo seed's phase-0 cleanup touches wallet_ledger — so it
          # must exist first. demo mode layers order-book liquidity + trade
          # volume + a demo portfolio (base leaves empty books -> no card
          # prices, inert trade ticket).
          go run ./cmd/seed -mode demo

      - name: Install frontend deps + build api-client
        working-directory: ${{ env.APP }}
        run: |
          yarn install --frozen-lockfile
          yarn lerna run build --scope @taptrade-ui/api-client --include-dependencies

      - name: Start player app (next dev :3010)
        working-directory: ${{ env.APP }}/packages/app
        env:
          # Empty API URL → the browser calls SAME-ORIGIN (/api/v1/*) and Next's
          # rewrites() proxies to the gateway, exactly like the demo/prod deploy.
          # Setting it to http://localhost:18080 makes the browser call the
          # gateway cross-origin, which the app's CSP (connect-src 'self') blocks.
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_AUTH_URL: ''
          NEXT_PUBLIC_WS_URL: ws://localhost:18080/ws
        run: |
          nohup npx next dev --webpack -p 3010 > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3010/ >/dev/null && break || sleep 2; done
          curl -fsS http://localhost:3010/ >/dev/null || { echo "::error::player app failed to start"; tail -80 /tmp/app.log; exit 1; }

      - name: Warm routes (dev-mode compiles on first hit)
        run: |
          for p in / /auth/login/ /predict/ /portfolio/ /leaderboards/ /account/ /rewards/ /store/; do
            if ! code=$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' --max-time 60 "http://localhost:3010$p"); then
              code=000
            fi
            echo "warm $p -> $code"
            [ "$code" = 200 ] || { echo "::error::failed to warm $p"; exit 1; }
          done

      - name: Install Playwright Chromium
        working-directory: ${{ env.APP }}/packages/app
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite (desktop)
        working-directory: ${{ env.APP }}/packages/app
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://localhost:3010
        run: npx playwright test --config=./playwright.config.ts --project=setup --project=desktop-chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/taptrade-platform/frontend/packages/app/playwright-report
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "::group::auth.log"; tail -120 /tmp/auth.log 2>/dev/null; echo "::endgroup::"
          echo "::group::gateway.log"; tail -120 /tmp/gateway.log 2>/dev/null; echo "::endgroup::"
          echo "::group::app.log"; tail -200 /tmp/app.log 2>/dev/null; echo "::endgroup::"
