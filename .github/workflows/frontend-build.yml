name: Frontend Build

# Clean-clone self-containment check: a fresh checkout with no sibling repos
# on the runner must install, typecheck, unit-test, and production-build the
# player app. Catches cross-repo symlinks and other machine-local
# dependencies that unit tests alone tolerate.
on:
  pull_request:
    paths:
      - 'apps/taptrade-platform/frontend/**'

jobs:
  clean-clone-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/taptrade-platform/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: apps/taptrade-platform/frontend/yarn.lock

      - name: Install dependencies (workspace root)
        run: yarn install --frozen-lockfile

      # Build workspace deps first: bare `@taptrade-ui/api-client` imports
      # resolve to the package's dist/, which is gitignored — a fresh clone
      # must build it before the app can typecheck or compile. Same build
      # order as docker/frontend.Dockerfile.
      - name: Build workspace dependencies
        run: yarn lerna run build --scope @taptrade-ui/api-client --include-dependencies

      - name: Typecheck player app
        run: yarn workspace @taptrade-ui/app typecheck

      - name: Unit tests (player app)
        working-directory: apps/taptrade-platform/frontend/packages/app
        run: npm test

      - name: Production build (player app)
        working-directory: apps/taptrade-platform/frontend/packages/app
        run: yarn build
