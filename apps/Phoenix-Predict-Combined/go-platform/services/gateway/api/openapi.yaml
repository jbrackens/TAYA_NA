openapi: 3.0.3
info:
  title: Taya NA Predict API
  version: "1.0.0"
  description: >
    Prediction-market gateway API. Binary YES/NO contracts priced 0-100 cents
    (price = implied probability); winners pay 100c per contract at settlement.

    Coverage: this spec documents the CORE public + trading surface
    (discovery, markets, events, categories, orders, portfolio, bot API,
    auth proxy) verified against the live handlers and DTOs as of 2026-06.
    Admin (/api/v1/admin/*), the alpha cashier (/api/v1/cashier/alpha/*), CMS,
    leaderboards, and loyalty are intentionally out of scope here and tracked
    for documentation in IMPROVEMENT_PLAN.md P2-05 / G-04. The previous
    sportsbook-era spec was archived under
    archive/dead-2026-06/gateway-openapi-sportsbook.yaml.
servers:
  - url: http://localhost:18080
    description: Local development
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly session cookie issued by the auth service. Mutating requests also require the X-CSRF-Token header (double-submit cookie).
    BotApiKey:
      type: http
      scheme: bearer
      description: "Bot/partner API key: Authorization: Bearer tna_<prefix>_<secret>. Scopes: read, trade, admin."
  schemas:
    Market:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        ticker: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [unopened, open, halted, closed, settled, voided, proposed_resolution, disputed] }
        result: { type: string, enum: [yes, no], nullable: true }
        yesPriceCents: { type: integer, minimum: 1, maximum: 99 }
        noPriceCents: { type: integer, minimum: 1, maximum: 99 }
        lastTradePriceCents: { type: integer, nullable: true }
        volumeCents: { type: integer, format: int64 }
        openInterestCents: { type: integer, format: int64 }
        liquidityCents: { type: integer, format: int64 }
        feeRateBps: { type: integer }
        executionMode: { type: string, enum: [order_book, amm] }
        closeAt: { type: string, format: date-time }
      required: [id, eventId, ticker, title, status, yesPriceCents, noPriceCents]
    PlaceOrderRequest:
      type: object
      properties:
        marketId: { type: string, format: uuid }
        side: { type: string, enum: [yes, no] }
        action: { type: string, enum: [buy, sell] }
        orderType: { type: string, enum: [market, limit] }
        priceCents: { type: integer, minimum: 1, maximum: 99, nullable: true, description: required for limit orders }
        quantity: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, nullable: true }
        timeInForce: { type: string, enum: [gtc, ioc, fok], nullable: true }
        postOnly: { type: boolean }
        clientOrderId: { type: string, nullable: true }
        notionalCapCents: { type: integer, format: int64, nullable: true, description: required for market buys (dollar exposure ceiling) }
      required: [marketId, side, action, orderType, quantity]
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        marketId: { type: string, format: uuid }
        side: { type: string, enum: [yes, no] }
        action: { type: string, enum: [buy, sell] }
        orderType: { type: string, enum: [market, limit] }
        priceCents: { type: integer, nullable: true }
        quantity: { type: integer }
        filledQuantity: { type: integer }
        remainingQuantity: { type: integer }
        totalCostCents: { type: integer, format: int64 }
        status: { type: string, enum: [pending, open, partial, filled, cancelled, rejected, expired] }
        createdAt: { type: string, format: date-time }
      required: [id, marketId, side, action, orderType, quantity, status]
    Position:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        marketId: { type: string, format: uuid }
        side: { type: string, enum: [yes, no] }
        quantity: { type: integer }
        avgPriceCents: { type: integer }
        totalCostCents: { type: integer, format: int64 }
        realizedPnlCents: { type: integer, format: int64 }
      required: [id, marketId, side, quantity, avgPriceCents]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
paths:
  /api/v1/status:
    get:
      summary: Service status (public)
      responses:
        "200": { description: OK }
  /api/v1/discovery:
    get:
      summary: Discovery feed (featured, trending, closing soon) - public
      responses:
        "200": { description: Discovery sections of markets }
  /api/v1/categories:
    get:
      summary: List categories (public)
      responses:
        "200": { description: Categories array }
  /api/v1/events:
    get:
      summary: List events (public, paginated)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Events page }
  /api/v1/markets:
    get:
      summary: List markets (public, paginated)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Markets page
          content:
            application/json:
              schema:
                type: object
                properties:
                  markets: { type: array, items: { $ref: "#/components/schemas/Market" } }
                  total: { type: integer }
  /api/v1/markets/{ticker}:
    get:
      summary: Get a market by ticker (falls back to id) - public
      parameters:
        - { name: ticker, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Market
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Market" }
        "404": { description: Not found }
  /api/v1/markets/{id}/trades:
    get:
      summary: Recent trade tape for a market (public)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: Trades array }
  /api/v1/orders:
    post:
      summary: Place an order
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceOrderRequest" }
      responses:
        "201":
          description: Order (and first trade, if any)
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
        "403": { description: Compliance gate (geo/KYC) blocked, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      summary: List the caller's orders (paginated)
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: Orders page }
  /api/v1/orders/preview:
    post:
      summary: Preview an order's cost/fill without placing it
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceOrderRequest" }
      responses:
        "200": { description: Order preview }
  /api/v1/orders/{id}:
    delete:
      summary: Cancel a resting order
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Cancelled }
  /api/v1/portfolio:
    get:
      summary: The caller's open positions
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Position" }
  /api/v1/portfolio/summary:
    get:
      summary: Portfolio summary (value, PnL, accuracy)
      security: [{ SessionCookie: [] }]
      responses:
        "200": { description: Summary }
  /api/v1/portfolio/history:
    get:
      summary: Settled-position history (paginated)
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: History page }
  /api/v1/bot/orders:
    post:
      summary: Place an order via a partner API key (scope-gated, geo/KYC enforced)
      security: [{ BotApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceOrderRequest" }
      responses:
        "201": { description: Order + trade }
        "403": { description: Missing scope or compliance gate blocked }
  /api/v1/bot/positions:
    get:
      summary: List positions via a partner API key (read scope)
      security: [{ BotApiKey: [] }]
      responses:
        "200": { description: Positions }
  /api/v1/bot/keys:
    get:
      summary: List the caller's API keys
      security: [{ SessionCookie: [] }]
      responses:
        "200": { description: API keys }
    post:
      summary: Create an API key (self-serve; gated off in prod by default)
      security: [{ SessionCookie: [] }]
      responses:
        "201": { description: API key (full secret shown once) }
        "403": { description: Self-serve creation disabled }
  /api/v1/auth/login:
    post:
      summary: Log in (sets HttpOnly session cookies + CSRF token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
              required: [username, password]
      responses:
        "200": { description: Session established }
        "401": { description: Invalid credentials }
        "429": { description: Rate limited / account locked }
  /api/v1/auth/session:
    get:
      summary: Current session
      security: [{ SessionCookie: [] }]
      responses:
        "200": { description: Session info }
        "401": { description: No valid session }
