# Production demo overlay for Path A (single box).
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#
# Deploys are automated: pushing changes under apps/Phoenix-Predict-Combined/
# to feat/binary-exchange-engine triggers .github/workflows/deploy-demo.yml
# (rsync -> on-box build -> recreate player -> health check). No manual step.
#
# Base docker-compose.yml already wires postgres+redis+gateway+auth with the
# store-mode gates (WALLET_STORE_MODE/GATEWAY_READ_REPO_MODE/AUTH_STORE_MODE=db).
# This overlay (a) hardens env for a public demo, (b) adds the two Next
# standalone frontends + Caddy (the only public surface).
#
# Prereqs (validated 2026-05-17 — see DEMO_DEPLOYMENT_PLAN.md "Validation status"):
#   1. Build the slim images first (on the box, on corp VPN NOT required):
#        cd talon-backoffice
#        docker build -f docker/frontend.Dockerfile --build-arg module_name=app \
#          --build-arg NEXT_PUBLIC_WS_URL=wss://demo.99rtp.io/ws   -t predict-frontend:app-slim .
#        docker build -f docker/frontend.Dockerfile --build-arg module_name=office \
#          --build-arg NEXT_PUBLIC_WS_URL=wss://office.99rtp.io/ws -t predict-frontend:office-slim .
#   2. export JWT_SECRET=$(openssl rand -hex 32)
#   3. up; then run one-shot migrate + `seed -mode demo` (Phase A2) — demo data
#      (u-1 == demo@phoenix.local) is MANDATORY or the demo looks empty.
#   4. Put the bcrypt hash in ./Caddyfile (office basic_auth).
#
# ENVIRONMENT is deliberately left UNSET (validated Path A choice): WS
# CheckOrigin then allows (no WS_ALLOWED_ORIGINS trap), wallet won't fatal,
# all seed users present. The "production-mode" guards protect against a
# misconfigured EXTERNAL dsn — N/A with a pinned local Postgres container.

# restart: unless-stopped on EVERY service. The base docker-compose.yml sets
# no restart policy; during validation a Docker Desktop auto-update restarted
# the VM (29.3.1 -> 29.4.3) and the whole demo stayed down with no recovery.
# For an unattended always-on demo ("we don't know when they'll test") a host
# or Docker restart MUST self-heal — this is the fix.
services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped

  auth:
    restart: unless-stopped
    environment:
      AUTH_COOKIE_SECURE: "true"                 # Caddy terminates TLS; cookie is HTTPS-only
      JWT_SECRET: "${JWT_SECRET:?export a strong JWT_SECRET before up}"
      LOG_LEVEL: "info"

  gateway:
    restart: unless-stopped
    environment:
      WALLET_DB_DRIVER: "postgres"
      WALLET_DB_MAX_OPEN_CONNS: "20"             # local PG max_conns=100; only real knob
      WALLET_DB_MAX_IDLE_CONNS: "4"
      LOG_LEVEL: "info"
      # no JWT_SECRET here (gateway delegates token validation to auth);
      # no GATEWAY_CORS_ORIGINS (single origin — CORS never triggers).
      # Synthetic Market Maker: dynamic two-sided liquidity on every open
      # order_book market so the CLOB is tradeable before external MMs sign.
      # Risk-bounded: $10 committed per side per market + 500-share per-side
      # position cap (worst-case ~$250 one-sided exposure per market). The bot
      # cancels stale quotes and re-quotes around the moving mid each tick, so
      # liquidity is self-healing (unlike the static demo-seed book it replaces).
      SMM_ENABLED: "true"
      SMM_DEPTH_CENTS: "1000"
      SMM_HALF_SPREAD_CENTS: "3"
      SMM_MAX_POSITION_QTY: "500"
      SMM_TICK_INTERVAL: "30s"
      # Play-money faucet: a freshly-registered player can claim a one-time
      # starter balance ($10,000 here) so they are immediately tradeable. The
      # grant is idempotent (one per user) and credits only the session user.
      # A REAL-MONEY deployment MUST leave this at 0 (the default) — see the
      # POST /api/v1/wallet/starter-grant handler.
      STARTER_GRANT_CENTS: "1000000"
      # --- Activation knobs for wired-but-unconfigured features (off by ---
      # --- default; uncomment + supply real values to take each live). ---
      # Crypto (USDC) on-chain rail — needs an RPC, the asset contract, and a
      # deposit-address source (HD xpub / KMS / custody provider). Fails closed
      # until all three are set. See internal/payments/crypto_rail.go.
      # CRYPTO_NETWORK: "base"
      # CRYPTO_ASSET: "USDC"
      # CRYPTO_RPC_URL: ""
      # CRYPTO_ASSET_CONTRACT: ""
      # CRYPTO_DEPOSIT_ADDRESS_SOURCE: ""
      # CRYPTO_CONFIRMATIONS: "12"
      # Automated KYC vendor (manual back-office review works without these).
      # KYC_IDV_PROVIDER: "sumsub"   # or onfido / persona
      # KYC_IDV_API_KEY: ""
      # KYC just-in-time gates (manual review + admin approval already enforce).
      # KYC_ENFORCEMENT: "true"            # gate withdrawals above threshold
      # KYC_REQUIRED_FOR_TRADING: "true"   # require verified identity to trade
      # KYC_WITHDRAWAL_THRESHOLD_CENTS: "250000"
      # Jurisdiction gate (launch policy: outside-US). Needs an edge that sets
      # the country header (e.g. Cloudflare CF-IPCountry) or the gate fails
      # closed for everyone. See internal/compliance/geo_gate.go.
      # GEO_GATE_ENABLED: "true"
      # GEO_ALLOWED_COUNTRIES: "PH,ID,TH,VN,MY,SG"
      # GEO_COUNTRY_HEADER: "CF-IPCountry"
      # Email notifications (resolution/payout). Logs until SMTP_HOST is set.
      # SMTP_HOST: ""
      # SMTP_PORT: "587"
      # SMTP_USER: ""
      # SMTP_PASSWORD: ""
      # SMTP_FROM: "no-reply@hulana.app"
      # NOTIFY_RESOLUTION_TO: "ops@hulana.app"

  player:
    image: predict-frontend:app-slim
    container_name: predict_player
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""                    # client same-origin; Caddy owns /api
    volumes:
      # sync-markets-rehosted market thumbnails are RUNTIME state, not source.
      # Persist them on a volume the player serves so a code rsync --delete /
      # image rebuild can't clobber them and desync DB image_url ↔ files.
      # Next standalone serves public/ from <serverdir>/public at runtime.
      - market_images:/app/packages/app/public/images/markets
    depends_on: [gateway]
    networks: [predict_network]

  office:
    image: predict-frontend:office-slim
    container_name: predict_office
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
      # The App Router login proxy at app/api/auth/login/route.ts does a
      # SERVER-SIDE fetch to ${NEXT_PUBLIC_AUTH_URL}/api/v1/auth/login.
      # Without this, it falls back to http://localhost:18081 — i.e. the
      # office container's OWN localhost, where nothing listens — and the
      # try/catch returns "Internal server error" (500) on every login.
      # The auth service is reachable on the predict_network at service
      # name `auth`. Same name the gateway uses (see docker-compose.yml
      # AUTH_SERVICE_URL).
      NEXT_PUBLIC_AUTH_URL: "http://auth:18081"
    depends_on: [gateway]
    networks: [predict_network]

  caddy:
    image: caddy:2
    container_name: predict_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                         # persists Let's Encrypt certs across restarts
      - caddy_config:/config
    depends_on: [player, office, gateway]
    networks: [predict_network]

  # Automated logical backups of the Predict database. Loops pg_dump (default
  # every 6h), keeps BACKUP_RETENTION_DAYS of gzipped dumps on the db_backups
  # volume. pg_dump is read-only on the source. Local-only by default — a local
  # backup does NOT survive box loss, so set BACKUP_OFFSITE_CMD for true offsite.
  # The deploy workflow recreates named services only, so activate this once on
  # the box:
  #   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d db-backup
  db-backup:
    image: postgres:16-alpine
    container_name: predict_db_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: predict
      PGPASSWORD: localdev               # demo only; supply real creds in production
      PGDATABASE: predict
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_INTERVAL_SECONDS: "21600"   # 6h
    volumes:
      - ./ops/backup:/ops:ro
      - db_backups:/backups
    command: ["sh", "-c", "while true; do sh /ops/backup-db.sh || true; sleep \"$$BACKUP_INTERVAL_SECONDS\"; done"]
    networks: [predict_network]

volumes:
  caddy_data:
  caddy_config:
  market_images:   # sync-markets thumbnails; survives rsync/rebuild/recreate
  db_backups:      # automated pg_dump backups (db-backup sidecar)

networks:
  predict_network:
