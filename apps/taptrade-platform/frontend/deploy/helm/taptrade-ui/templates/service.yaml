apiVersion: v1
kind: Service
metadata:
  name: {{ include "taptrade-ui.fullname" . }}
  labels:
    {{- include "taptrade-ui.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "taptrade-ui.selectorLabels" . | nindent 4 }}
