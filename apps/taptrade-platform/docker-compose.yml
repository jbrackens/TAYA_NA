services:
  postgres:
    image: postgres:16-alpine
    container_name: predict_postgres
    environment:
      POSTGRES_DB: predict
      POSTGRES_USER: predict
      POSTGRES_PASSWORD: localdev
    # Port 5434 on host to avoid collision with the existing sportsbook container
    # on 5432 and the swarmqa one on 5433.
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predict -d predict"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - predict_network

  redis:
    image: redis:7-alpine
    container_name: predict_redis
    # Port 6380 on host to avoid collision with the existing sportsbook redis on 6379.
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - predict_network

  gateway:
    build:
      context: ./go-platform
      dockerfile: services/gateway/Dockerfile
    container_name: predict_gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Bind to loopback only: the gateway origin must not be reachable from
      # off-box. In a deployed topology the only ingress is the edge/Caddy over
      # the compose network; a host-published :18080 lets a direct request
      # supply its own CF-IPCountry and bypass geo-fencing (audit SEC-03).
      # Local dev keeps localhost access.
      - "127.0.0.1:18080:18080"
    environment:
      GATEWAY_PORT: "18080"
      GATEWAY_DB_DSN: "postgres://predict:localdev@postgres:5432/predict?sslmode=disable"
      WALLET_DB_DSN: "postgres://predict:localdev@postgres:5432/predict?sslmode=disable"
      WALLET_STORE_MODE: "db"
      GATEWAY_READ_REPO_MODE: "db"
      REDIS_URL: "redis://redis:6379/0"
      # P2-07 cross-instance WS backbone. Default (unset) = local in-process,
      # correct for this single-instance demo. Set WS_BACKBONE=redis to fan
      # WebSocket broadcasts across multiple gateway replicas over REDIS_URL.
      # WS_BACKBONE: "redis"
      AUTH_SERVICE_URL: "http://auth:18081"
      PAYMENTS_WEBHOOK_SECRET: "whsec_local"
      LOG_LEVEL: "debug"
    networks:
      - predict_network

  auth:
    build:
      context: ./go-platform
      dockerfile: services/auth/Dockerfile
    container_name: predict_auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18081:18081"
    environment:
      AUTH_PORT: "18081"
      AUTH_STORE_MODE: "db"
      AUTH_DB_DSN: "postgres://predict:localdev@postgres:5432/predict?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      # Redis-backed rate limiting + sessions (multi-instance + restart-durable).
      # Sessions live in db 1 to stay separate from the gateway cache in db 0.
      AUTH_REDIS_URL: "redis://redis:6379/1"
      LOG_LEVEL: "debug"
      JWT_SECRET: "dev-secret-key-change-in-production"
      AUTH_COOKIE_SECURE: "false"
    networks:
      - predict_network

volumes:
  postgres_data:
  redis_data:

networks:
  predict_network:
    driver: bridge
